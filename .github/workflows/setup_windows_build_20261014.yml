# Created: 2026-10-14 JST
# Windows setup validation has no Saxo OAuth, secret, or live API dependency.
name: Setup ChartRecorder Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-setup:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        shell: pwsh
        run: python -m pip install -r requirements-windows.txt
      - name: Run complete regression suite
        shell: pwsh
        run: python -m pytest -q
      - name: Build ChartRecorder and setup.exe
        shell: cmd
        run: scripts\build_setup_windows.bat
      - name: Smoke-test packaged installer in isolated runner directory
        shell: pwsh
        run: |
          if (!(Test-Path dist\setup.exe)) { throw "Missing dist/setup.exe" }
          $setup = (Resolve-Path 'dist\setup.exe').Path
          $dry = Start-Process -FilePath $setup -ArgumentList '--dry-run', '--yes' -Wait -PassThru
          if ($dry.ExitCode -ne 0) { throw "Packaged installer dry-run failed: $($dry.ExitCode)" }
          # External system.yaml overrides the bundled default only for this smoke test.
          $parent = $env:RUNNER_TEMP.Replace('\', '/')
          $config = @(
            'install:'
            "  location: '$parent'"
            '  folder_name: ChartRecorderSmoke'
            '  image_folder: chart_image'
          )
          $config | Set-Content -Path 'dist\system.yaml' -Encoding utf8
          $installed = Start-Process -FilePath $setup -ArgumentList '--yes' -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Packaged installer failed: $($installed.ExitCode)" }
          $target = Join-Path $env:RUNNER_TEMP 'ChartRecorderSmoke'
          if (!(Test-Path (Join-Path $target 'ChartRecorder.exe'))) { throw 'Installed EXE missing' }
          if (!(Test-Path (Join-Path $target 'setting.yaml'))) { throw 'Installed setting.yaml missing' }
          if (!(Test-Path (Join-Path $target 'system.yaml'))) { throw 'Installed system.yaml missing' }
          if (!(Test-Path (Join-Path $target 'chart_image'))) { throw 'Installed chart_image missing' }
          $settings = Get-Content (Join-Path $target 'setting.yaml') -Raw
          if ($settings -notmatch "local_dir\s*:\s*'chart_image'") { throw 'Installed output directory is not portable' }
          Remove-Item 'dist\system.yaml' -Force
          $size = (Get-Item $setup).Length
          if ($size -lt 1000000) { throw "setup.exe unexpectedly small" }
          Write-Host "Packaged setup.exe smoke PASS; bytes: $size"
      - name: Upload setup.exe installer
        uses: actions/upload-artifact@v4
        with:
          name: ChartRecorder-setup-windows
          path: dist/setup.exe
          retention-days: 7
          if-no-files-found: error
