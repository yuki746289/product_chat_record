# Created: 2026-10-14 JST
# Windows-only, no Saxo credentials or live API calls.
name: Validate ChartRecorder Windows Tray
on:
  workflow_dispatch:
  # Temporary test-only trigger; remove immediately after verified run.
  push:
    branches: ['feature/tray-startup-restart-dialog-20261014']
    paths:
      - '.github/test-request/20261014-restart-dialog.txt'
permissions:
  contents: read
jobs:
  windows-tray-validation:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Windows application dependencies
        shell: pwsh
        run: python -m pip install -r requirements-windows.txt
      - name: Validate pystray Win32 backend is importable
        shell: pwsh
        run: python -c "import pystray._win32; print('pystray Win32 backend import PASS')"
      - name: Run full regression tests including tray visibility
        shell: pwsh
        run: python -m pytest -q
      - name: Build standalone Windows EXE
        shell: cmd
        run: scripts\build_windows.bat
      - name: Verify bundled EXE exists
        shell: pwsh
        run: |
          $file = Get-Item -Path dist\ChartRecorder.exe -ErrorAction Stop
          if ($file.Length -le 1000000) { throw "Unexpectedly small EXE" }
          Write-Host "Built ChartRecorder.exe bytes: $($file.Length)"
