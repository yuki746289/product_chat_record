# ChartRecorder installer destinations. No credentials or Saxo tokens belong here.
# Updated: 2026-10-14 JST (select from desktop/c_drive/custom in setup UI or CLI).
# Run setup.exe again after changing the install location.
install:
  location     : desktop       # desktop=Windows Desktop, c_drive=C:/, or absolute parent path (example: D:/Apps)
  folder_name  : ChartRecorder # folder created under location
  image_folder : chart_image   # child folder for captures and local logs
