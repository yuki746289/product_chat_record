# 重要指標判定マスター（仕様データ。Windows EXEへの読み込みは未実装）
# S/Aは独自固定ランク。配信元のimportance/星の数による上書きを禁止。
schema_version: 1
policy_version: "2026-10-15.1"
status: "specification_only"
timezone: "Asia/Tokyo"
target_currencies: [USD, JPY, EUR, GBP, AUD, NZD, CAD]
rules:
  provider_importance: "reference_only"
  accepted_priorities: [S, A]
  normalization: "NFKC_CASEFOLD_COLLAPSE_WHITESPACE_EXACT"
  unmatched: "REVIEW"
  ambiguous: "ERROR"
  source_country_required: true
  grouping: "same_currency_same_indicator_id_same_release_timestamp"
  speech_matching: "allowlist_only"
  official_actuals: "first_party_preferred"
  calendar_schedule_and_forecast: "licensed_provider_pending"
  fetched_failure_is_zero_events: false
  version_change_required_for_rule_edits: true
