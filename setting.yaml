# Created: 2026-10-10 JST
# FX currency pairs and local Saxo OpenAPI chart output configuration.
repository: yuki746289/product_chat_record

provider:
  type: tradingview_mcp
  url: https://mcp.tradingview.com/mcp
  enabled: false

symbols:
  # クロス円以外
  - {pair: GBPAUD, category: cross_non_jpy, tradingview: FX:GBPAUD}
  - {pair: AUDUSD, category: cross_non_jpy, tradingview: FX:AUDUSD}
  - {pair: GBPUSD, category: cross_non_jpy, tradingview: FX:GBPUSD}
  - {pair: EURGBP, category: cross_non_jpy, tradingview: FX:EURGBP}
  - {pair: USDCAD, category: cross_non_jpy, tradingview: FX:USDCAD}
  - {pair: EURUSD, category: cross_non_jpy, tradingview: FX:EURUSD}
  - {pair: GBPNZD, category: cross_non_jpy, tradingview: FX:GBPNZD}

  # クロス円
  - {pair: AUDJPY, category: cross_jpy, tradingview: FX:AUDJPY}
  - {pair: GBPJPY, category: cross_jpy, tradingview: FX:GBPJPY}
  - {pair: USDJPY, category: cross_jpy, tradingview: FX:USDJPY}
  - {pair: EURJPY, category: cross_jpy, tradingview: FX:EURJPY}
  - {pair: CADJPY, category: cross_jpy, tradingview: FX:CADJPY}
  - {pair: NZDJPY, category: cross_jpy, tradingview: FX:NZDJPY}

market:
  skip_stale: true
  max_1m_age_minutes: 10

chart:
  timeframes: [1M, 5M, 15M, 1H, 4H, 8H, 1D, 1W, 1Mn]
  ema: [20, 30, 40]
  rci: [9, 14, 26]
  columns: 2
  bars: 110
  history_bars: 220
  right_padding_bars: 12
  dpi: 110
  figsize: [19, 25]
  timezone: Asia/Tokyo
  theme: dark

output:
  staging_dir: output
  timezone: Asia/Tokyo
  folder_format: '%Y%m%d_%H%M'
  local_dir: 'C:/TradingViewCharts'
  artifact_name: charts
  retention_hours: 8

# Do not place secrets or OAuth tokens in this public configuration file.
saxo:
  enabled: true
  environment: sim
  redirect_uri: http://localhost:8765/callback
  price_side: bid

local_monitor:
  mode: saxo_local
  poll_seconds: 60
  chart_interval_minutes: 30
  retention_hours: 8
  min_folders: 16